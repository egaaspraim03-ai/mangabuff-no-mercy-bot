name: Run bot

on:
  workflow_dispatch:
  schedule:
    - cron: "50 20 * * *"   # ~23:50 МСК (UTC+3)

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -U pip
          pip install -r requirements.txt
      - name: Run combо
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FULL_COOKIE: ${{ secrets.FULL_COOKIE }}
          CLUB_SLUG: ${{ secrets.CLUB_SLUG }}
          MODE: all
          # optional free proxies (часто бесполезно):
          # FREE_PROXIES: "http://1.2.3.4:8080,http://5.6.7.8:3128"
        run: python bot.py
